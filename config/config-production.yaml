# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: false
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: webhook
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths: [/api/v1/webhooks/subscriptions/create, /api/v1/webhooks/subscriptions/update, /api/v1/webhooks/subscriptions/rotate-secret, /api/v1/webhooks/subscriptions/delete, /api/v1/webhooks/subscriptions/test, /api/v1/webhooks/deliveries/replay]
  grpc_methods: [/platform.webhook.v1.WebhookService/CreateSubscription, /platform.webhook.v1.WebhookService/UpdateSubscription, /platform.webhook.v1.WebhookService/RotateSubscriptionSecret, /platform.webhook.v1.WebhookService/DeleteSubscription, /platform.webhook.v1.WebhookService/TestSubscription, /platform.webhook.v1.WebhookService/ReplayDelivery]
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
outbound:
  grpc:
    authorization:
      target: authorization-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: authorization-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
    application:
      target: application-service.platform.svc.cluster.local:9090
      timeout: 5s
      retry: {max_attempts: 3, initial_backoff: 100ms, max_backoff: 1s, methods: [/platform.application.v1.ApplicationService/BatchCheckTenantApplications]}
      breaker: {enabled: true, failure_threshold: 5, open_timeout: 30s}
      tls: {enabled: true, server_name: application-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
