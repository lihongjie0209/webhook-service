apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-service
  namespace: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-service
  namespace: platform
data:
  APP_ENV: production
  APP_HTTP_ADDRESS: 0.0.0.0:8080
  APP_GRPC_ADDRESS: 0.0.0.0:9090
  APP_GRPC_TLS_CERT_FILE: /etc/webhook-service/tls/tls.crt
  APP_GRPC_TLS_KEY_FILE: /etc/webhook-service/tls/tls.key
  APP_DATABASE_ENABLED: "true"
  APP_DATABASE_TYPE: postgres
  APP_DATABASE_NAME: platform
  APP_DATABASE_SCHEMA: webhook
  APP_REDIS_ENABLED: "true"
  APP_RATE_LIMIT_ENABLED: "true"
  APP_IDEMPOTENCY_ENABLED: "true"
  APP_EVENT_BUS_ENABLED: "true"
  APP_EVENT_BUS_URLS: nats://nats.platform.svc.cluster.local:4222
  APP_EVENT_BUS_STREAM_NAME: PLATFORM_EVENTS
  APP_EVENT_BUS_SUBJECTS: platform.>
  APP_AUTH_JWKS_URL: http://identity-service.platform.svc.cluster.local:8080/.well-known/jwks.json
  APP_AUTH_ISSUER: identity-service
  APP_AUTH_AUDIENCE: webhook-service
  APP_OBSERVABILITY_METRICS_ENABLED: "true"
  APP_MIGRATION_AUTO_UP: "true"
  APP_MIGRATION_PATH: /app/migrations/postgres
  APP_MIGRATION_TABLE: webhook_schema_migrations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-service
  namespace: platform
  labels:
    app.kubernetes.io/name: webhook-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-service
    spec:
      serviceAccountName: webhook-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook-service
      containers:
        - name: api
          image: ghcr.io/lihongjie0209/webhook-service:main
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: webhook-service
            - secretRef:
                name: webhook-service
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 5]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: grpc-tls
              mountPath: /etc/webhook-service/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: grpc-tls
          secret:
            secretName: webhook-service-grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: platform
  labels:
    app.kubernetes.io/name: webhook-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webhook-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhook-service
  namespace: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webhook-service
  namespace: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webhook-service
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-service
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 9090, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 3306, protocol: TCP}
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 8080, protocol: TCP}
        - {port: 4318, protocol: TCP}
        - {port: 4222, protocol: TCP}
        - {port: 443, protocol: TCP}
