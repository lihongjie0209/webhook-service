apiVersion: v1
kind: Secret
metadata:
  name: webhook-service
  namespace: platform
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=webhook
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=webhook
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  # Generate with: openssl rand -base64 32
  APP_WEBHOOK_ENCRYPTION_KEY: replace-with-base64-encoded-32-random-bytes
  APP_AUTH_CLIENT_ID: replace-me
  APP_AUTH_CLIENT_SECRET: replace-me
---
# Create this Secret from a certificate issued by the cluster PKI, for example:
# kubectl create secret tls webhook-service-grpc-tls --cert=tls.crt --key=tls.key -n platform
apiVersion: v1
kind: Secret
metadata:
  name: webhook-service-grpc-tls
  namespace: platform
type: kubernetes.io/tls
stringData:
  tls.crt: replace-with-pem-certificate
  tls.key: replace-with-pem-private-key
